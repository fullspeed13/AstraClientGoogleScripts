<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullspeed's Games | Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="logo">Fullspeed's Games</div>
    </nav>

    <main class="container">
        <header class="hero">
        </header>
        <div class="button-grid">
            <button class="launch-card" onclick="launchGame('astra.html')">
                <span class="version">Astra Client</span>
                <span class="desc">A version of Minecraft</span>
            </button>

            <button class="launch-card" onclick="launchGame('cookieclicker.html')">
                <span class="version">Cookie Clicker</span>
                <span class="desc">Open Cookie Clicker</span>
            </button>
            
            <button class="launch-card" onclick="launchGame('f1game.html')">
                <span class="f1">Formula Prototype</span>
                <span class="desc">A F1 style game</span>
            </button>
             
            <button class="launch-card" onclick="launchGame('2048.html')">
                <span class="_2048">2048</span>
                <span class="desc">Open 2048</span>
            </button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
